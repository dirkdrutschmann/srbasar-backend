name: Backend CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

concurrency:
  group: srbasar-backend-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24.x'
  DEPLOY_HOST: mail.clubcircle.de
  DEPLOY_PORT: '22'
  DEPLOY_USER: root
  BACKEND_ROOT: /var/www/clients/client2/web3/private
  BACKEND_INCOMING: /var/www/clients/client2/web3/private/.srbasar/incoming/backend
  DEPLOY_PM2_USER: web3
  DEPLOY_PM2_HOME: /var/lib/pm2/web3/.pm2
  DEPLOY_NODE_PATH: /opt/node-v24.15.0/bin:/usr/local/bin:/usr/bin:/bin

jobs:
  quality:
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Run tests
        run: npm test -- --runInBand

  deploy:
    name: Deploy release tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit production dependencies before deployment access
        run: npm run audit:production

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          package_version="$(node -p "require('./package.json').version")"
          [[ "$package_version" == "$version" ]] || {
            echo "Tag $version does not match package.json version $package_version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Disable legacy file watchers before upload
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$BACKEND_ROOT/current' && runuser -u '$DEPLOY_PM2_USER' -- env PM2_HOME='$DEPLOY_PM2_HOME' PATH='$DEPLOY_NODE_PATH' node -" < ops/disableDeployWatch.js

      - name: Upload source archive
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          archive="$BACKEND_INCOMING/srbasar-backend-${VERSION}.tar.gz"
          ssh -p "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "install -d -m 700 '$BACKEND_INCOMING'"
          git archive --format=tar.gz --prefix=source/ "$GITHUB_SHA" | \
            ssh -p "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "tmp='$archive.tmp.$$'; cat > \"\$tmp\"; mv -f \"\$tmp\" '$archive'"

      - name: Activate release
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          archive="$BACKEND_INCOMING/srbasar-backend-${VERSION}.tar.gz"
          staging="$BACKEND_ROOT/.incoming-${VERSION}-$$"
          ssh -p "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail; mkdir -p '$staging'; tar --extract --gzip --file '$archive' --directory '$staging' --strip-components=1 --no-same-owner --no-same-permissions; SRBASAR_PM2_USER='$DEPLOY_PM2_USER' SRBASAR_PM2_HOME='$DEPLOY_PM2_HOME' SRBASAR_NODE_BIN='/opt/node-v24.15.0/bin/node' bash '$staging/ops/deploy.sh' '$VERSION' '$staging'; rm -rf -- '$staging' '$archive'"
